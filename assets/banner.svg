<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a" />
      <stop offset="55%" stop-color="#0e1d30" />
      <stop offset="100%" stop-color="#04141c" />
    </linearGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="none" />
      <rect width="16" height="1" y="15" fill="#12263a" opacity="0.6" />
      <rect height="16" width="1" x="15" fill="#12263a" opacity="0.6" />
    </pattern>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e6e6" />
      <stop offset="100%" stop-color="#7ff0ff" />
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e6e6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00e6e6" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.07" />
      <rect y="2" width="4" height="2" fill="none" />
    </pattern>
    <symbol id="pokeball" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="48" fill="#fff" stroke="#111" stroke-width="6"/>
      <path d="M4 50h92" stroke="#111" stroke-width="10"/>
      <path d="M4 50A46 46 0 0 1 96 50" fill="#e03131"/>
      <circle cx="50" cy="50" r="18" fill="#fff" stroke="#111" stroke-width="6"/>
      <circle cx="50" cy="50" r="8" fill="#c9d1d9" stroke="#111" stroke-width="4"/>
    </symbol>
    <symbol id="coin" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="#f7c948" stroke="#b8860b" stroke-width="6"/>
      <circle cx="50" cy="50" r="30" fill="none" stroke="#b8860b" stroke-width="4"/>
      <circle cx="50" cy="50" r="16" fill="none" stroke="#d99f1b" stroke-width="3"/>
    </symbol>
    <symbol id="star4" viewBox="0 0 20 20">
      <polygon points="10,2 12,8 18,8 13,12 15,18 10,14 5,18 7,12 2,8 8,8" fill="#f7c948"/>
    </symbol>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#grid)"/>

  <!-- central cyan glow -->
  <ellipse cx="800" cy="200" rx="620" ry="190" fill="url(#cyanGlow)"/>

  <!-- floating coins (Meowth payday motif) -->
  <g filter="url(#glow)">
    <use href="#coin" x="110" y="120" width="90" height="90">
      <animate attributeName="y" values="120;110;120" dur="3s" repeatCount="indefinite"/>
    </use>
    <use href="#coin" x="1395" y="120" width="90" height="90">
      <animate attributeName="y" values="120;110;120" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </use>
  </g>
  <use href="#coin" x="330" y="300" width="46" height="46" opacity="0.7">
    <animate attributeName="y" values="300;292;300" dur="4s" repeatCount="indefinite"/>
  </use>
  <use href="#coin" x="1220" y="300" width="46" height="46" opacity="0.7">
    <animate attributeName="y" values="300;292;300" dur="4s" begin="2s" repeatCount="indefinite"/>
  </use>

  <!-- decorative pokeballs -->
  <g opacity="0.9">
    <use href="#pokeball" x="60" y="60" width="100" height="100"/>
    <use href="#pokeball" x="1440" y="60" width="100" height="100"/>
  </g>

  <!-- twinkling stars -->
  <use href="#star4" x="230" y="80" width="18" height="18">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
  </use>
  <use href="#star4" x="1340" y="70" width="18" height="18">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </use>
  <use href="#star4" x="420" y="60" width="14" height="14">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </use>
  <use href="#star4" x="1160" y="50" width="14" height="14">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.5s" repeatCount="indefinite"/>
  </use>
  <use href="#star4" x="760" y="340" width="14" height="14">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
  </use>
  <use href="#star4" x="840" y="80" width="12" height="12">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.8s" repeatCount="indefinite"/>
  </use>

  <!-- title panel -->
  <g filter="url(#glow)">
    <rect x="230" y="115" width="1140" height="175" fill="#06121b" stroke="#00e6e6" stroke-width="7"/>
    <text x="800" y="190" text-anchor="middle" font-size="46" font-family="'Press Start 2P','VT323',monospace" font-weight="bold" fill="url(#titleGrad)" letter-spacing="3">SUCHAKRA KUMAR GATTU</text>
    <text x="800" y="252" text-anchor="middle" font-size="24" font-family="'Press Start 2P','VT323',monospace" fill="#9ae6ff" opacity="0.95" letter-spacing="1">SPEECH AI &#8226; LLM INFERENCE &#8226; RAG PIPELINES</text>
  </g>

  <!-- border + scanlines -->
  <rect x="8" y="8" width="1584" height="404" fill="none" stroke="#0cf" stroke-width="8"/>
  <rect width="1600" height="420" fill="url(#scan)"/>
</svg>
